<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog — MenoMe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink:   #f2c4ce;
      --yellow: #f9e8c0;
      --green:  #c8dfc8;
      --blue:   #c4d4e8;
      --cream:  #faf8f5;
      --text:   #3a3530;
      --muted:  #9a9088;
      --border: #e8e2da;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Jost', sans-serif;
      background-color: var(--cream);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    body::before {
      content: '';
      position: fixed;
      top: -100px;
      right: -100px;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, var(--pink) 0%, transparent 70%);
      opacity: 0.4;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: fixed;
      bottom: -100px;
      left: -100px;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, var(--blue) 0%, transparent 70%);
      opacity: 0.35;
      pointer-events: none;
    }

    header {
      padding: 2.5rem 3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 0.1s;
    }

    .wordmark {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 1.1rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
    }

    header nav a {
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      margin-left: 2rem;
      transition: color 0.3s ease;
    }

    header nav a:hover { color: var(--text); }

    main {
      flex: 1;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem 3rem 4rem;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 4rem;
      align-items: start;
    }

    /* ── LEFT COLUMN: Calendar ── */
    .calendar-section {
      opacity: 0;
      animation: fadeUp 0.9s ease forwards 0.3s;
    }

    .section-label {
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2rem;
    }

    /* Month navigation */
    .month-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
    }

    .month-nav button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      color: var(--muted);
      padding: 0.25rem 0.5rem;
      transition: color 0.3s ease;
      line-height: 1;
    }

    .month-nav button:hover { color: var(--text); }

    .month-title {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 1.5rem;
      letter-spacing: 0.05em;
      color: var(--text);
    }

    /* Day-of-week headers */
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .cal-dow {
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
      padding-bottom: 0.5rem;
    }

    .cal-day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 300;
      color: var(--text);
      border-radius: 50%;
      cursor: default;
      transition: background 0.2s ease;
      position: relative;
    }

    .cal-day.empty { cursor: default; }

    .cal-day.has-post {
      cursor: pointer;
      background: var(--pink);
      color: var(--text);
      font-weight: 400;
    }

    .cal-day.has-post:hover {
      background: #e8a8b8;
    }

    .cal-day.today {
      box-shadow: 0 0 0 1px var(--muted);
    }

    /* ── RIGHT COLUMN: Latest Posts ── */
    .posts-section {
      opacity: 0;
      animation: fadeUp 0.9s ease forwards 0.5s;
      position: sticky;
      top: 2rem;
    }

    .posts-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .posts-list li {
      border-bottom: 1px solid var(--border);
    }

    .posts-list li:first-child {
      border-top: 1px solid var(--border);
    }

    .posts-list a {
      display: block;
      padding: 1.25rem 0;
      text-decoration: none;
      color: var(--text);
      transition: color 0.3s ease;
    }

    .posts-list a:hover { color: var(--muted); }

    .post-date {
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }

    .post-title {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 400;
      font-size: 1.1rem;
      line-height: 1.3;
    }

    /* ── POST OVERLAY ── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(250, 248, 245, 0.96);
      z-index: 100;
      overflow-y: auto;
      padding: 3rem;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .overlay.active {
      display: block;
    }

    .overlay.visible {
      opacity: 1;
    }

    .overlay-inner {
      max-width: 660px;
      margin: 0 auto;
    }

    .overlay-close {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 3rem;
      padding: 0;
      transition: color 0.3s ease;
    }

    .overlay-close:hover { color: var(--text); }

    .overlay-date {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1rem;
    }

    .overlay-title {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.1;
      margin-bottom: 2.5rem;
      color: var(--text);
    }

    .overlay-rule {
      width: 40px;
      height: 1px;
      background: var(--pink);
      margin-bottom: 2.5rem;
    }

    .overlay-body {
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      font-size: 1rem;
      line-height: 1.85;
      color: var(--text);
    }

    .overlay-body p {
      margin-bottom: 1.5rem;
    }

    .overlay-body em {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.05rem;
    }

    .overlay-body hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2rem 0;
    }

    .overlay-body .ai-note {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }

    footer {
      padding: 2rem 3rem;
      text-align: center;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      color: var(--muted);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      main {
        grid-template-columns: 1fr;
        gap: 3rem;
        padding: 1.5rem;
      }
      header { padding: 1.5rem; }
      .posts-section { position: static; }
      .overlay { padding: 1.5rem; }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="wordmark">MenoMe</a>
    <nav>
      <a href="about.html">About</a>
      <a href="blog.html">Blog</a>
    </nav>
  </header>

  <main>
    <!-- Calendar -->
    <section class="calendar-section">
      <p class="section-label">Journal</p>
      <div class="month-nav">
        <button id="prevMonth" aria-label="Previous month">&#8592;</button>
        <span class="month-title" id="monthTitle"></span>
        <button id="nextMonth" aria-label="Next month">&#8594;</button>
      </div>
      <div class="cal-grid" id="calGrid">
        <div class="cal-dow">Mo</div>
        <div class="cal-dow">Tu</div>
        <div class="cal-dow">We</div>
        <div class="cal-dow">Th</div>
        <div class="cal-dow">Fr</div>
        <div class="cal-dow">Sa</div>
        <div class="cal-dow">Su</div>
      </div>
    </section>

    <!-- Latest posts -->
    <aside class="posts-section">
      <p class="section-label">Latest posts</p>
      <ul class="posts-list" id="postsList"></ul>
    </aside>
  </main>

  <!-- Post overlay -->
  <div class="overlay" id="overlay" role="dialog" aria-modal="true">
    <div class="overlay-inner">
      <button class="overlay-close" id="overlayClose">&#8592; Back to journal</button>
      <p class="overlay-date" id="overlayDate"></p>
      <h1 class="overlay-title" id="overlayTitle"></h1>
      <div class="overlay-rule"></div>
      <div class="overlay-body" id="overlayBody"></div>
    </div>
  </div>

  <footer>&copy; 2026 MenoMe</footer>

  <script>
    // ── POSTS DATA ──────────────────────────────────────────────────────────
    const posts = [
      {
        date: '2026-04-30',
        title: 'Episode 1: The Day It All Began',
        body: `
          <p>I woke up early on a day off and, for some reason, a lot of the thinking and training I'd been doing about AI suddenly clicked. I had a light bulb moment about creating an app to support women going through the menopause — something I feel quite passionately about. I feel they're quite under-supported at the moment, and there could be a gap in the market.</p>

          <p>This whole thing is also a project to test whether software development has now reached a stage where someone with no coding expertise or background — i.e. me — can, through AI assistance, create a fully working, released product, get it into Apple's App Store, and actually have people downloading and using it.</p>

          <p>It was quite an exciting day, that first one. I was full of ideas about what the features of the app could be, and right from the outset I've used AI as a thinking partner to develop the initial proposition. I was amazed that by the end of day one I already had a forty-page document setting out quite clearly and logically the different steps and stages to go through.</p>

          <p>Later in the evening, having gone on to YouTube and looked at videos of people creating apps this way, I experimented with an app called Bitrig, where you can get a working prototype going through your phone itself without even needing a laptop. I got a very early prototype with some basic functionality — a symptoms checklist that users can enter. It was remarkable to see how, within a matter of hours, an idea had been shaped and led through to a very early prototype of some of the app's functionality.</p>

          <p>My feelings at the end of day one were a mixture of excitement and nervousness. The excitement was the thrill of learning something new, the pleasure of potentially setting something up that will be of genuine use to people, and the importance to me of establishing — right from the outset — a corporate structure around the app on a not-for-profit basis. That feels aligned with my values, and I think it will be a bit of a differentiator in terms of building trust and transparency: where the money goes, what it's for, and the emphasis on data minimisation and privacy first.</p>

          <p>The nervousness is whether this is all a big AI hallucination — whether it's actually possible to do this from scratch as a single person with no background. There's also the question of costs. To do it properly there will be some professional fees upfront, and there's a version of this where I spend quite a lot of money on something that two or three people use before it fizzles out or gets overtaken by something else.</p>

          <p>There's nervousness too about ongoing support — whether it's credible or sensible to release a product when I don't understand the underlying code, and am relying purely on AI both to write it and to keep it live as users report bugs, request features, or as the platforms it relies on are themselves updated. All of this in the context of still having a full-time job, done in evenings and weekends.</p>

          <p>I recognise this is a phase of energy and excitement. But will that tail off when I'm trying to debug something and it just won't work? Will I lose heart? Will I give up? Will it turn out to be a waste of time?</p>

          <p>I'm feeling all of those things at the end of day one.</p>

          <p class="ai-note">(This blog entry was lightly tidied by AI, based on a transcript that I recorded, but the words are mine.)</p>
        `
      },
      {
        date: '2026-05-02',
        title: 'Episode 2: Values and Principles',
        body: `
          <p>By way of an update: I'm keen to get on with actually building something. The reason for that is I still haven't fully committed to following through on this whole project — because I don't know how hard it's going to be, or how much effort I'll need to put in. And I don't know that because I haven't started building anything yet.</p>

          <p>The AI is supremely confident it's all going to be achievable. I'm very well aware it would say that.</p>

          <p>So I want to start building, to get an intuitive feel for just how realistic a proposition this actually is. But I can't do that at the moment, for a host of really mundane reasons — mainly that I don't have an up-to-date iOS on my MacBook, and upgrading it takes multiple hours. Many hours. And then there's making sure the upgrade doesn't break my music software, which is my other passion project. So that's where things stand on that front.</p>

          <p>In the background, though, I have reached one milestone: I now have a registered, functioning website — the one these blog posts are being published on. That did give me a shot of confidence in the feasibility of the whole project, because I leant heavily on the AI to make it happen. I created a website once before, probably nearly 25 years ago in the early days of the internet, but that was very basic. I had no idea whether I'd be able to do this — though I was more confident the AI would help me through it. And indeed it did. I also managed to find a name that I think fits the intent of the project.</p>

          <p>More generally, I've been chewing over what the core values of the product will be, and what the core values of the governance structure around it will be. I have a sense that this is the foundation layer I'll need to keep coming back to when making decisions along the way.</p>

          <p>I'm also thinking about the extent to which that value set — the corporate structure, the governance — is itself part of what makes this product different. Whether users will care about it. I'm hoping, in a sense, to fill a gap in the market for people who want apps like this but have been put off by fears about what happens to their data: fears that it will be harvested and sold on, fears that a business model ultimately oriented around profit might not put the user's interests first.</p>

          <p>The fact that I'm not going to do any of that — I'm hoping that will be a genuine differentiator. But then I'm also weighing that against the question of whether the product itself has features that are genuinely innovative and new. I've been working with the AI on some market research, and that's going reasonably well, though it slightly worries me that it may be hallucinating in its evaluation of competing products. I'll need to do some independent checking — some, certainly, though how much I'm not sure.</p>

          <p>What I do know is that with a bit of a build under my belt, I should be in a more confident position to judge whether this is actually doable within a realistic time frame and cost envelope. And then I'll know a bit more about where I stand on the biggest initial decision of all: am I actually going to do this thing or not?</p>

          <p class="ai-note">(This blog entry was lightly tidied by AI, based on a transcript that I recorded, but the words are mine.)</p>
        `
      }
    ];

    // ── CALENDAR LOGIC ──────────────────────────────────────────────────────
    const START_YEAR  = 2026;
    const START_MONTH = 3;   // 0-indexed → April
    const END_YEAR    = 2026;
    const END_MONTH   = 11;  // 0-indexed → December

    const today = new Date();
    let currentYear  = today.getFullYear();
    let currentMonth = today.getMonth();

    if (currentYear < START_YEAR || (currentYear === START_YEAR && currentMonth < START_MONTH)) {
      currentYear = START_YEAR; currentMonth = START_MONTH;
    }
    if (currentYear > END_YEAR || (currentYear === END_YEAR && currentMonth > END_MONTH)) {
      currentYear = END_YEAR; currentMonth = END_MONTH;
    }

    const postsByDate = {};
    posts.forEach(p => { postsByDate[p.date] = p; });

    const monthNames = ['January','February','March','April','May','June',
                        'July','August','September','October','November','December'];

    function pad(n) { return String(n).padStart(2, '0'); }

    function renderCalendar() {
      const grid = document.getElementById('calGrid');
      const cells = grid.querySelectorAll('.cal-day');
      cells.forEach(c => c.remove());

      document.getElementById('monthTitle').textContent =
        `${monthNames[currentMonth]} ${currentYear}`;

      const firstDay = new Date(currentYear, currentMonth, 1).getDay();
      const offset   = (firstDay === 0) ? 6 : firstDay - 1;
      const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

      for (let i = 0; i < offset; i++) {
        const empty = document.createElement('div');
        empty.className = 'cal-day empty';
        grid.appendChild(empty);
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${currentYear}-${pad(currentMonth + 1)}-${pad(d)}`;
        const cell    = document.createElement('div');
        cell.className = 'cal-day';
        cell.textContent = d;

        const isToday =
          d === today.getDate() &&
          currentMonth === today.getMonth() &&
          currentYear  === today.getFullYear();

        if (isToday) cell.classList.add('today');

        if (postsByDate[dateStr]) {
          cell.classList.add('has-post');
          cell.setAttribute('role', 'button');
          cell.setAttribute('tabindex', '0');
          cell.setAttribute('aria-label', postsByDate[dateStr].title);
          cell.addEventListener('click',   () => openPost(dateStr));
          cell.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') openPost(dateStr);
          });
        }

        grid.appendChild(cell);
      }

      document.getElementById('prevMonth').disabled =
        (currentYear === START_YEAR && currentMonth === START_MONTH);
      document.getElementById('nextMonth').disabled =
        (currentYear === END_YEAR && currentMonth === END_MONTH);
    }

    document.getElementById('prevMonth').addEventListener('click', () => {
      if (currentMonth === 0) { currentMonth = 11; currentYear--; }
      else currentMonth--;
      if (currentYear < START_YEAR || (currentYear === START_YEAR && currentMonth < START_MONTH)) {
        currentYear = START_YEAR; currentMonth = START_MONTH;
      }
      renderCalendar();
    });

    document.getElementById('nextMonth').addEventListener('click', () => {
      if (currentMonth === 11) { currentMonth = 0; currentYear++; }
      else currentMonth++;
      if (currentYear > END_YEAR || (currentYear === END_YEAR && currentMonth > END_MONTH)) {
        currentYear = END_YEAR; currentMonth = END_MONTH;
      }
      renderCalendar();
    });

    // ── LATEST POSTS ────────────────────────────────────────────────────────
    function renderLatestPosts() {
      const list   = document.getElementById('postsList');
      const sorted = [...posts].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 5);

      sorted.forEach(p => {
        const li   = document.createElement('li');
        const a    = document.createElement('a');
        a.href     = '#';
        a.addEventListener('click', (e) => { e.preventDefault(); openPost(p.date); });

        const dateEl       = document.createElement('p');
        dateEl.className   = 'post-date';
        const d            = new Date(p.date + 'T00:00:00');
        dateEl.textContent = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });

        const titleEl       = document.createElement('p');
        titleEl.className   = 'post-title';
        titleEl.textContent = p.title;

        a.appendChild(dateEl);
        a.appendChild(titleEl);
        li.appendChild(a);
        list.appendChild(li);
      });
    }

    // ── OVERLAY ─────────────────────────────────────────────────────────────
    function openPost(dateStr) {
      const post    = postsByDate[dateStr];
      if (!post) return;

      const d = new Date(dateStr + 'T00:00:00');
      document.getElementById('overlayDate').textContent =
        d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      document.getElementById('overlayTitle').textContent = post.title;
      document.getElementById('overlayBody').innerHTML    = post.body;

      const overlay = document.getElementById('overlay');
      overlay.classList.add('active');
      overlay.scrollTop = 0;
      requestAnimationFrame(() => overlay.classList.add('visible'));
      document.body.style.overflow = 'hidden';
    }

    function closePost() {
      const overlay = document.getElementById('overlay');
      overlay.classList.remove('visible');
      setTimeout(() => {
        overlay.classList.remove('active');
        document.body.style.overflow = '';
      }, 300);
    }

    document.getElementById('overlayClose').addEventListener('click', closePost);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closePost();
    });

    // ── INIT ────────────────────────────────────────────────────────────────
    renderCalendar();
    renderLatestPosts();
  </script>
</body>
</html>
